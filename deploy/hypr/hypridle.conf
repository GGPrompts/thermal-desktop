general {
    # Don't try to lock — thermal-lock disabled on NVIDIA
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim after 30 min (safe, no GPU issues)
listener {
    timeout = 1800
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Screen off after 2 hours — use brightness 0 instead of DPMS to avoid
# NVIDIA DRM resume bugs that freeze keyboard focus (see therm-uqay)
listener {
    timeout = 7200
    on-timeout = brightnessctl -s set 0
    on-resume = brightnessctl -r
}
