# ╔══════════════════════════════════════════════════════════╗
# ║  THERMAL OS — Hyprland Config                           ║
# ║  FLIR / Infrared HUD Desktop Environment                ║
# ╚══════════════════════════════════════════════════════════╝

# ── Monitor ────────────────────────────────────────────────
monitor = DP-1, 3440x1440@100, 0x0, 1
monitor = HDMI-A-2, 1920x1080@144, 3440x0, 1, transform, 3

# ── Workspace Defaults ────────────────────────────────────
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:HDMI-A-2, default:true

# ── Autostart ──────────────────────────────────────────────
# Export Wayland env vars to systemd so user services can access the compositor
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_RUNTIME_DIR DISPLAY HYPRLAND_INSTANCE_SIGNATURE

# Thermal daemons managed by systemd user services (thermal.target)
exec-once = systemctl --user start thermal.target

# Non-daemon autostart (compositor utilities, not managed by systemd)
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Legacy exec-once (replaced by systemd services) ───────
# exec-once = thermal-bar
# exec-once = thermal-notify
# exec-once = swww-daemon
# exec-once = sleep 1 && thermal-wallpaper-cycle 300
# exec-once = thermal-messages --persist
# exec-once = thermal-audio
# exec-once = thermal-hud
# exec-once = /home/builder/projects/thermal-desktop/scripts/codex-state-adapter.sh --daemon
# exec-once = thc daemon

# Launch a terminal on startup
exec-once = kitty

# ── Environment ────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1
env = NVD_BACKEND,direct
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = TERMINAL,kitty
env = EDITOR,micro

# ── Input ──────────────────────────────────────────────────
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── General ────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # THERMAL-COLORS-START
    # Thermal border colors: active = searing red, inactive = cold purple
    col.active_border = rgba(ef4444ff) rgba(f97316ff) 45deg
    col.inactive_border = rgba(2d1b69ff)
    # THERMAL-COLORS-END

    layout = dwindle
    allow_tearing = false
}

# ── Decoration ─────────────────────────────────────────────
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.1
        brightness = 0.8
    }

    # Thermal glow shadow
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(ef444466)
        color_inactive = rgba(0a001066)
    }
}

# ── Animations ─────────────────────────────────────────────
animations {
    enabled = true

    # Thermal scan-in effects
    bezier = thermalIn, 0.05, 0.9, 0.1, 1.05
    bezier = thermalOut, 0.16, 1, 0.3, 1
    bezier = heatWave, 0.37, 0, 0.63, 1

    animation = windows, 1, 5, thermalIn, slide
    animation = windowsOut, 1, 5, thermalOut, slide
    animation = border, 1, 8, heatWave
    animation = borderangle, 1, 60, heatWave, loop
    animation = fade, 1, 5, thermalIn
    animation = workspaces, 1, 4, thermalIn, slide
}

# ── Layout ─────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ── Misc ───────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    allow_session_lock_restore = true
}

# ── Key Bindings ───────────────────────────────────────────
$mod = SUPER

# Core
bind = $mod, Return, exec, thc window
bind = $mod, KP_Enter, exec, thc window
bind = $mod SHIFT, Return, exec, ~/bin/kitty-cwd.sh
bind = $mod SHIFT, KP_Enter, exec, ~/bin/kitty-cwd.sh
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar --quit 2>/dev/null; thunar
bind = $mod, V, togglefloating
bind = $mod, D, exec, thermal-launch
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, F, fullscreen
bind = $mod, period, exec, bemoji -t

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Resize
bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod CTRL, down, resizeactive, 0 40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Cycle workspaces (Super+` = next, Super+Shift+` = prev)
bind = $mod, grave, workspace, e+1
bind = $mod SHIFT, grave, workspace, e-1

# Move/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -

# Volume / Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Lock
bind = $mod SHIFT, L, exec, thermal-lock

# Notification center (thermal-notify has no toggle client, removed swaync-client bind)

# Cheat sheet
bind = $mod, slash, exec, ~/bin/cheatsheet.sh

# Push-to-talk voice input (thermal-audio)
bind = $mod, backslash, exec, ~/projects/thermal-desktop/scripts/thermal-voice-toggle.sh
# Mouse side buttons — PTT voice-to-text (back/thumb) and voice-to-dispatcher (forward)
bind = , mouse:275, exec, thermal-audio toggle
bind = , mouse:276, exec, thermal-audio dispatch

# Pin window (stays on all workspaces)
bind = $mod, Y, pin
bind = $mod, N, pin
bind = $mod SHIFT, P, pin
bind = $mod, O, pin

# TUI launchers
bind = $mod, B, exec, thc window -- btop
bind = $mod, T, exec, thc window -- thc tui

# Window rules
windowrule {
    name = kitty-opacity
    match:class = kitty
    opacity = 0.92
}

windowrule {
    name = firefox-opacity
    match:class = firefox
    opacity = 0.95
}

windowrule {
    name = pavucontrol-float
    match:class = pavucontrol
    float = yes
}

windowrule {
    name = btop-float
    match:title = btop
    float = yes
    size = 80% 80%
}
