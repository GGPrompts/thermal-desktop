# ╔══════════════════════════════════════════════════════════╗
# ║  THERMAL OS — Kitty Terminal Config                     ║
# ║  FLIR / Infrared HUD Terminal                           ║
# ║                                                         ║
# ║  Colors sourced from thermal-desktop palette.rs          ║
# ║  (thermal-core/src/palette.rs → Color::from_hex)        ║
# ╚══════════════════════════════════════════════════════════╝

# ── Font ───────────────────────────────────────────────────
# JetBrainsMono Nerd Font for ligatures + icon glyphs
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
# Emoji fallback
symbol_map U+1F5D1,U+1F5BC,U+2673,U+1F300-U+1F9FF Noto Color Emoji

# ── Cursor ─────────────────────────────────────────────────
# WHITE_HOT (#fef3c7) — maximum contrast against BG
cursor                  #fef3c7
cursor_text_color       #0a0010
cursor_shape            beam
cursor_beam_thickness   2.0
cursor_blink_interval   0.5

# ── Scrollback ─────────────────────────────────────────────
scrollback_lines 50000
scrollback_pager_history_size 100

# ── Mouse ──────────────────────────────────────────────────
mouse_hide_wait 3.0
# ACCENT_COOL (#3b82f6) — visible links in cool blue
url_color #3b82f6
url_style straight

# ── Remote Control (required for thc / thermal-conductor) ─
# socket-only: restricts remote control to the Unix socket
# (more secure than 'yes' which also allows child processes)
allow_remote_control socket-only
# Fixed socket path for thc to connect to
listen_on unix:/tmp/kitty-thc

# ── Shell Integration ────────────────────────────────────
# Enables prompt marking, CWD reporting, etc.
shell_integration enabled

# ── Window ─────────────────────────────────────────────────
window_padding_width 8
background_opacity 0.90
dynamic_background_opacity yes
confirm_os_window_close 0

# ── Bell ───────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0
visual_bell_color none

# ── Tab Bar ──────────────────────────────────────────────
# Powerline-style tab bar with thermal heat signature colors
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
# Active tab: SEARING red bg, BG text (hot = active)
active_tab_foreground   #0a0010
active_tab_background   #ef4444
active_tab_font_style   bold
# Inactive tab: TEXT_MUTED on BG_SURFACE (cold = idle)
inactive_tab_foreground #9b8dd1
inactive_tab_background #120822

# THERMAL-COLORS-START
# ── Thermal Color Scheme ──────────────────────────────────

# Background / Foreground
background #0a0010
foreground #c4b5fd
selection_background #1a0030
selection_foreground #e9e0ff

# Black (cold void)
color0  #0a0010
color8  #8878c7

# Red (searing / critical)
color1  #ef4444
color9  #f87171

# Green (readout / warm)
color2  #22c55e
color10 #34d399

# Yellow (hot)
color3  #eab308
color11 #f97316

# Blue (cool)
color4  #3b82f6
color12 #818cf8

# Magenta (cold spectrum)
color5  #818cf8
color13 #c4b5fd

# Cyan (neutral / teal)
color6  #14b8a6
color14 #2dd4bf

# White (white-hot)
color7  #e9e0ff
color15 #fef3c7
# THERMAL-COLORS-END

# ── Shell ──────────────────────────────────────────────────
shell /bin/zsh
editor micro

# ── Keyboard Shortcuts ────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
